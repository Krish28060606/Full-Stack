<!DOCTYPE html>
<html>

<head>
    <title>bento</title>

    <style>
        :root {
            --primary-color: blue;
            --secondary-color: black;
            --size: 30px;
        }

        .container {
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: calc(var(--size)/2);
            outline: 1px solid black;
            color: white;
            border-radius: 20%;


        }

        #parent {
            display: grid;
            background-color: var(--primary-color);
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
            border-radius: 30% 0 0 0;
        }

        #child {
            background-color: black;
            grid-column: 2/3;
            grid-row: 2/3;
            font-size: var(--size);


        }

        #child:hover {
            transform: translate(100px, 50px);
        }
    </style>
</head>

<body>

    <body>

        <div class="container">
            <div id="parent">
                <div id="child">
                    hello
                </div>
            </div>


        </div>

    </body>

</body>

</html><task class="html"></task>
