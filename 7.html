<!DOCTYPE html>
<html>
<head>
    <title>Image Bigger Than Box</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            border: 2px solid black;
        }

        .img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

    <div class="img">
        <img src="logo.jpg" alt="Logo">
    </div>

</body>
</html>
