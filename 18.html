<!DOCTYPE html>
<html>

<head>
    <title>placeholder</title>

    <style>
        section h2{
            color: blue;
        }
        section>h2{
            color: red;
        }
        h2+p{
            color: rgb(247, 0, 0);
            font-weight: 900;
        }
        h2~p{
            color: brown;
        }
    </style>
</head>

<body>
   <section>
    <h2>Heading 1</h2>
    <p>para 1</p>
    <p>para 2</p>
    <div>
        <h2>Heading 2</h2>
    </div>
   </section>
</body>

</html>
