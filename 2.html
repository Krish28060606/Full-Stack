<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Bar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        h1{
            text-align:center;
            margin:20px 0;
        }

        .container{
            background-color:black;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 40px;
        }

        .logo{
            color:white;
            font-size:28px;
            font-weight:bold;
        }

        .menu{
            display:flex;
            gap:30px;
        }

       .card{
    color:white;
    font-size:20px;
    text-decoration:none;
    cursor:pointer;
    padding:10px 15px;
    border-radius:5px;
    transition:0.3s;
}

.card:hover{
    background-color:white;
    color:black;
}
        .logo img{
    width:60px;      
    height:60px;
    border-radius:50%; 
    object-fit:cover;
}
    </style>
</head>

<body>

<h1>Task 2 : Responsive Navigation Bar</h1>

<div class="container">

    <div class="logo">
        <img src="logo.jpg" alt="logo">
    </div>

   <div class="menu">
    <a href="https://chatgpt.com/" class="card" target="_blank">GPT</a>
    <a href="https://github.com/" class="card">git hub</a>
    <a href="#" class="card">New 2</a>
    <a href="#" class="card">New 3</a>
</div>

</div>

</body>
</html>
