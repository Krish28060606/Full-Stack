<!DOCTYPE html>
<html>
<head>
    <title>Horizontal Sticky Pages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: auto;
            overflow-y: hidden;
        }

        .container {
            display: flex;
            width: 500vw;
        }

        .page {
            width: 100vw;
            height: 100vh;

            position: sticky;
            left: 0;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 100px;
        }

        .page1 {
            background-color: rgb(0, 0, 0);
            z-index: 1;
        }

        .page2 {
            background-color: rgb(9, 9, 8);
            z-index: 2;
        }

        .page3 {
            background-color: rgb(0, 0, 0);
            z-index: 3;
        }

        .page4 {
            background-color: rgb(0, 0, 0);
            z-index: 4;
        }

        .page5 {
            background-color: lightgreen;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="page page1">
            <img src= "rcb5.jpg">
        </div>

        <div class="page page2">
            <img src= "rcb4.jpg" >
        </div>

        <div class="page page3">
            <img src= "rcb3.jpg">
        </div>

        <div class="page page4">
            <img src= "rcb2.jpg">
        </div>

        <div class="page page5">
            <img src= "rcb1.jpg">
        </div>

    </div>

</body>
</html>
