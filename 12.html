<!DOCTYPE html>
<html>
<head>
    <title>Health Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .health-container {
            width: 500px;
            height: 35px;

            background-color: grey;
            border-radius: 20px;

            overflow: hidden;
        }

        .health-bar {
            width: 87%;
            height: 100%;

            background: linear-gradient(
                to right,
                limegreen,
                green
            );

            border-radius: 60px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .health-bar span {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="health-container">

        <div class="health-bar">
            <span>87%</span>
        </div>

    </div>

</body>
</html>
