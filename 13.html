<!DOCTYPE html>
<html>
<head>
    <title>Float</title>

    <style>
        #img1 {
            float: left;
            height: 200px;
            width: 200px;
        }

        #img2 {
            float: right;
            height: 200px;
            width: 200px;
        }

        
    </style>
</head>

<body>

    <img id="img1" src="logo.jpg" alt="logo">
    <img id="img2" src="logo.jpg" alt="logo">

    <p>
        This paragraph is now between the two images.
        The left image is floated to the left and the right image
        is floated to the right. Therefore, the paragraph content
        occupies the space available between them.
        This is how text wrapping around floated elements works in CSS.
    </p>

</body>
</html>
