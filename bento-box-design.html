<!DOCTYPE html>
<html>
<head>
    <title>bento</title>

    <style>
        .container{
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-areas: 
            "box1 box1 box1"
            "box1 box1 box1"
            "box2 box3 box6"
            "box2 box3 box5"
            "box4 box4 box4";
            outline: 1px dashed grey;
            gap: 30px;
        }
        .container>div{
            outline: 1px solid black;
            border-radius: 3%;
            box-shadow: 3px 3px 5px rgb(45, 194, 4);
            
            
        }
        
 
        
    </style>
</head>

<body>

   <body>

    <div class="container">

        <div style="grid-area: box1">1</div>
        <div style="grid-area: box2">2</div>
        <div style="grid-area: box3">3</div>
        <div style="grid-area: box4">4</div>
        <div style="grid-area: box5">5</div>
        <div style="grid-area: box6">6</div>
        

    </div>

</body>

</body>
</html>
