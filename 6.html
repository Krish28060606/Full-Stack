<!DOCTYPE html>
<html>
<head>
    <title>Position Practice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }

        html {
            
            background: linear-gradient(rgb(43, 59, 181),rgb(177, 0, 0));
        }

        body {
            
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            background: linear-gradient(red,black);
            
        }

        .box {
            width: 100%;
            height: 800px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
            overflow: hidden;
        }

        #box1{
            position: sticky;
           
            top:0;
        }

        /* Box 2 */
        #box2 {
            
            position: sticky;
            top: 0;
        }

        /* Box 3 */
        #box3 {
            top : 0;
            position: sticky;
        }

        /* Box 4 */
        #box4 {
            
            position: sticky;
            top: 0;
        }

        /* Box 5 */
        #box5 {
           
            position: sticky;
            top: 0;
        }

        /* Images */
        .box img {
            width: 500px;
            height: 600px;
            object-fit: cover;
            border-radius: 20px;
          
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box" id="box1">
            <img src="logo.jpg" alt="Image 1">
        </div>

        <div class="box" id="box2">
            <img src="logo.jpg" alt="Image 2">
        </div>

        <div class="box" id="box3">
            <img src="logo.jpg" alt="Image 3">
        </div>

        <div class="box" id="box4">
            <img src="logo.jpg" alt="Image 4">
        </div>

        <div class="box" id="box5">
            <img src="logo.jpg" alt="Image 5">
        </div>

    </div>

</body>
</html>
