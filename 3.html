<!DOCTYPE html>
<html>
<head>
    <title>Cards</title>

    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:50px;
    flex-wrap:wrap;
}

.card{
    width:250px;
    background:white;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    overflow:hidden;
    text-align:center;
    transition:0.3s;
    padding-bottom:20px;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h2{
    margin-top:15px;
    color:#333;
}

.price{
    color:green;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
} </style>
</head>

<body>

<div class="container">

    <div class="card">
        <img src="pr1.avif" alt="Product 1">
        <h2>Headphones</h2>
        <p class="price">$19</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="pr2.jpg" alt="Product 2">
        <h2>Beauty</h2>
        <p class="price">$34</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="pr3.jpg" alt="Product 3">
        <h2>Ear buds</h2>
        <p class="price">$23</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="pr4.jpg" alt="Product 4">
        <h2>Drink</h2>
        <p class="price">$12</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
